project:
  type: website
  output-dir: docs
  resources:
    - assets/logo_header.svg
  render:
    - index.Rmd
    - tutorial.qmd
    - data.qmd

execute:
  freeze: auto
  echo: false
  warning: false
  message: false

lang: pt

website:
  title: "CancerTrialsBR"
  favicon: assets/favicon.ico
  navbar:
    logo: "assets/logo_header.svg"
    title: false
    search: false
    left:
      - href: index.Rmd
        text: Início
      - href: tutorial.qmd
        text: Tutorial
      - href: data.qmd
        text: Dados
    right:
      - icon: github
        href: "https://github.com/felippelazar/CancerTrialsBR"

format:
  html:
    theme: [flatly, custom.scss]
    toc: true
    code-copy: true
    include-in-header:
      - file: script.html
